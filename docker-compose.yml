services:
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: cctv-go2rtc
    restart: always
    ports:
      # Port 1984 removed from public host exposure for security
      - "8554:8554" # RTSP
      - "8555:8555/tcp" # WebRTC
      - "8555:8555/udp" # WebRTC
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: cctv-web-dashboard
    restart: always
    environment:
      - CCTV_USER=ijal
      - CCTV_PASS=CctvBojong@2026!
    ports:
      - "5009:3000"
    depends_on:
      - go2rtc

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: cctv-ai-detector
    restart: always
    environment:
      - RTSP_URL=rtsp://admin:admin2008@192.168.1.2:554/cam/realmonitor?channel=1&subtype=1
    # Port 5050 removed from public host exposure for security
    volumes:
      - ./ai/snapshots:/app/snapshots
      - ./ai/recordings:/app/recordings
      - ./ai/data:/app/data
      - ./ai/server.py:/app/server.py
      - ./ai/detector.py:/app/detector.py